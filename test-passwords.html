<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>?? Тест Паролів - Food Delivery</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .test-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #667eea;
        }
        
        .test-card h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        
        .credentials {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            margin: 1rem 0;
        }
        
        .test-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .test-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .result {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .test-all-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 2rem 0;
            transition: all 0.3s ease;
        }
        
        .test-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.3);
        }
        
        .summary {
            background: #e7f3ff;
            padding: 1.5rem;
            border-radius: 12px;
            margin: 2rem 0;
            text-align: center;
        }
        
        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
        }
        
        .links a {
            background: #667eea;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .links a:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>?? Тест Паролів Food Delivery</h1>
        
        <div class="summary">
            <h3>?? Статус тестування</h3>
            <p id="testSummary">Натисніть "Протестувати всі акаунти" для перевірки</p>
        </div>
        
        <button class="test-all-btn" onclick="testAllAccounts()">
            ?? Протестувати всі акаунти
        </button>
        
        <div class="links">
            <a href="test-accounts.html">?? Тестові Акаунти</a>
            <a href="pages/login.html">?? Сторінка Логіну</a>
            <a href="index.html">?? Головна</a>
        </div>
        
        <div class="test-grid" id="testGrid">
            <!-- Тести будуть додані динамічно -->
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Тестові акаунти з правильними паролями
        const testAccounts = [
            {
                name: '????? Адміністратор',
                email: 'admin@fooddelivery.com.ua',
                password: 'admin2024',
                role: 'admin'
            },
            {
                name: '?? Кур\'єр Олексій',
                email: 'courier.alex@delivery.com.ua', 
                password: 'courier123',
                role: 'courier'
            },
            {
                name: '????? Кур\'єр Марія',
                email: 'maria.courier@delivery.com.ua',
                password: 'maria2024', 
                role: 'courier'
            },
            {
                name: '????? Менеджер Піцерії',
                email: 'manager.pizza@restaurant.com.ua',
                password: 'pizza2024',
                role: 'manager'
            },
            {
                name: '?? Тестовий Користувач',
                email: 'test@example.com',
                password: 'test123',
                role: 'user'
            },
            {
                name: '? VIP Клієнт',
                email: 'vip.client@foodlover.com.ua',
                password: 'vip2024',
                role: 'vip'
            },
            {
                name: '?? Демо Користувач',
                email: 'user@demo.com',
                password: '123456',
                role: 'user'
            }
        ];

        // Створити картки тестів
        function createTestCards() {
            const grid = document.getElementById('testGrid');
            
            testAccounts.forEach((account, index) => {
                const card = document.createElement('div');
                card.className = 'test-card';
                card.innerHTML = `
                    <h3>${account.name}</h3>
                    <div class="credentials">
                        <strong>?? Email:</strong> ${account.email}<br>
                        <strong>?? Пароль:</strong> ${account.password}<br>
                        <strong>?? Роль:</strong> ${account.role}
                    </div>
                    <button class="test-btn" onclick="testAccount(${index})">
                        ?? Тестувати Логін
                    </button>
                    <div class="result" id="result-${index}" style="display: none;"></div>
                `;
                grid.appendChild(card);
            });
        }

        // Тестувати один акаунт
        async function testAccount(index) {
            const account = testAccounts[index];
            const resultDiv = document.getElementById(`result-${index}`);
            
            try {
                // Отримати тестових користувачів з auth.js
                const testUsers = getTestUsers();
                const user = testUsers.find(u => u.email === account.email && u.password === account.password);
                
                if (user) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `? Успіх! Логін працює для ${user.name}`;
                    resultDiv.style.display = 'block';
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '? Помилка: Невірний email або пароль';
                    resultDiv.style.display = 'block';
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `? Помилка: ${error.message}`;
                resultDiv.style.display = 'block';
            }
        }

        // Тестувати всі акаунти
        async function testAllAccounts() {
            const summary = document.getElementById('testSummary');
            summary.textContent = '?? Тестування в процесі...';
            
            let successCount = 0;
            let totalCount = testAccounts.length;
            
            for (let i = 0; i < testAccounts.length; i++) {
                await testAccount(i);
                
                // Перевірити результат
                const resultDiv = document.getElementById(`result-${i}`);
                if (resultDiv.classList.contains('success')) {
                    successCount++;
                }
                
                // Невелика затримка між тестами
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            // Оновити підсумок
            summary.innerHTML = `
                ?? Результати тестування:<br>
                ? Успішно: ${successCount}/${totalCount}<br>
                ${successCount === totalCount ? 
                    '?? Всі акаунти працюють правильно!' : 
                    '?? Деякі акаунти мають проблеми'
                }
            `;
        }

        // Ініціалізація
        document.addEventListener('DOMContentLoaded', function() {
            createTestCards();
            
            // Перевірити чи завантажений auth.js
            if (typeof getTestUsers !== 'function') {
                const summary = document.getElementById('testSummary');
                summary.innerHTML = '?? Файл auth.js не завантажений. <a href="test-accounts.html">Перейти до тестових акаунтів</a>';
            }
        });
    </script>
</body>
</html>
