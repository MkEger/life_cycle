<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Payment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🍴 Food Delivery</h1>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="pages/about.html" class="nav-link">About</a>
                <a href="dishes.html" class="nav-link">Order Now</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="form-container">
                <h2 class="form-title">💳 Payment Information</h2>
                <form id="paymentForm">
                    <div class="form-group">
                        <label for="paymentMethod">Payment Method</label>
                        <select id="paymentMethod" name="paymentMethod" required>
                            <option value="">Select payment method</option>
                        </select>
                    </div>

                    <div class="payment-details" id="cardDetails">
                        <div class="form-group">
                            <label for="cardNumber">Card Number</label>
                            <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiryDate">Expiry Date</label>
                                <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" maxlength="5">
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="3">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="cardName">Cardholder Name</label>
                            <input type="text" id="cardName" name="cardName" placeholder="John Doe">
                        </div>
                    </div>

                    <div class="order-summary">
                        <h3>Order Summary</h3>
                        <div class="summary-items" id="summaryItems">
                            <!-- Order items will be displayed here -->
                        </div>
                        <div class="summary-total">
                            <span>Total:</span>
                            <span class="total-price" id="orderTotal">$0.00</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='dishes.html'">Back to Dishes</button>
                        <button type="button" class="btn btn-primary" onclick="window.location.href='address.html'">Next: Delivery Address</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            // ✅ Завантажуємо способи оплати з БД
            try {
                const response = await fetch('http://localhost:3000/api/payment-methods');
                const methods = await response.json();

                const select = document.getElementById('paymentMethod');
                methods.forEach(method => {
                    const option = document.createElement('option');
                    option.value = method.code;
                    option.textContent = method.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Помилка завантаження способів оплати:', error);
            }

            const continueBtn = document.querySelector('.btn-primary');
            if (continueBtn) {
                continueBtn.addEventListener('click', function(e) {
                    e.preventDefault();

                    const paymentMethod = document.getElementById('paymentMethod')?.value;

                    if (!paymentMethod) {
                        alert('Оберіть спосіб оплати!');
                        return;
                    }

                    localStorage.setItem('payment_method', paymentMethod);
                    window.location.href = 'address.html';
                });
            }
        });
    </script>
</body>
</html>
