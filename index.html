<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Dishes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🍴 Food Delivery</h1>
            <nav class="nav">
                <a href="index.html" class="nav-link active">Dishes</a>
                <button class="cart-btn" id="cartBtn">
                    🛒 Cart (<span id="cartCount">0</span>)
                </button>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <section class="category-section">
                <h2 class="category-title">🍽️ Food</h2>
                <div class="dishes-grid" id="foodGrid">
                    <!-- Food items will be loaded here -->
                </div>
            </section>

            <section class="category-section">
                <h2 class="category-title">🥤 Drinks</h2>
                <div class="dishes-grid" id="drinksGrid">
                    <!-- Drink items will be loaded here -->
                </div>
            </section>

            <section class="category-section">
                <h2 class="category-title">🍰 Desserts</h2>
                <div class="dishes-grid" id="dessertsGrid">
                    <!-- Dessert items will be loaded here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Shopping Cart Overlay -->
    <div class="cart-overlay" id="cartOverlay">
        <div class="cart-modal">
            <div class="cart-header">
                <h2>🛒 Shopping Cart</h2>
                <button class="close-btn" id="closeCartBtn">✖</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be displayed here -->
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span class="total-price" id="totalPrice">$0.00</span>
                </div>
                <button class="btn btn-primary" id="checkoutBtn">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
