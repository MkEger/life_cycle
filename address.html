<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery - Delivery Address</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🍴 Food Delivery</h1>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="pages/about.html" class="nav-link">About</a>
                <a href="dishes.html" class="nav-link">Order Now</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="form-container">
                <h2 class="form-title">📍 Delivery Address</h2>
                <form id="addressForm">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+1 234 567 8900" required>
                    </div>

                    <div class="form-group">
                        <label for="streetAddress">Street Address</label>
                        <input type="text" id="streetAddress" name="streetAddress" placeholder="123 Main Street" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" name="city" placeholder="City" required>
                        </div>
                        <div class="form-group">
                            <label for="state">State/Province</label>
                            <input type="text" id="state" name="state" placeholder="State" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="zipCode">ZIP Code</label>
                            <input type="text" id="zipCode" name="zipCode" placeholder="12345" required>
                        </div>
                        <div class="form-group">
                            <label for="country">Country</label>
                            <input type="text" id="country" name="country" placeholder="Country" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="deliveryNotes">Delivery Notes (Optional)</label>
                        <textarea id="deliveryNotes" name="deliveryNotes" placeholder="Add any special delivery instructions..." rows="3"></textarea>
                    </div>

                    <div class="order-summary">
                        <h3>Order Summary</h3>
                        <div class="summary-items" id="summaryItems">
                            <!-- Order items will be displayed here -->
                        </div>
                        <div class="summary-total">
                            <span>Total:</span>
                            <span class="total-price" id="orderTotal">$0.00</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='payment.html'">Back to Payment</button>
                        <button type="submit" class="btn btn-primary">Confirm Order</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
    <script>
        document.getElementById('addressForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Store address data
            const formData = new FormData(e.target);
            const addressData = {};
            formData.forEach((value, key) => {
                addressData[key] = value;
            });
            localStorage.setItem('deliveryAddress', JSON.stringify(addressData));
            // Redirect to confirmation
            window.location.href = 'confirmation.html';
        });
    </script>
</body>
</html>
