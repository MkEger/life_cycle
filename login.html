<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <a href="index.html"><h1>FoodHub</h1></a>
                </div>
                <a href="index.html" class="btn btn-secondary">Back to Home</a>
            </nav>
        </div>
    </header>

    <!-- Login Page Content -->
    <main class="auth-page">
        <div class="container">
            <div class="auth-header">
                <h1>LOGIN</h1>
            </div>

            <!-- Login Section -->
            <div class="auth-section">
                <div class="auth-label">LOGIN PAGE 1440</div>
                <div class="auth-container">
                    <div class="auth-banner">
                        <h2>Welcome<br>back!</h2>
                    </div>
                    <div class="auth-form-wrapper">
                        <h3>Login</h3>
                        <form class="auth-form" id="loginForm">
                            <div class="form-group">
                                <label for="loginEmail">Email</label>
                                <input type="email" id="loginEmail" name="email" placeholder="name@email.com" required>
                            </div>
                            <div class="form-group">
                                <label for="loginPassword">Password</label>
                                <div class="password-input">
                                    <input type="password" id="loginPassword" name="password" placeholder="••••••••••" required>
                                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                            <path d="M10 5C5 5 2 10 2 10s3 5 8 5 8-5 8-5-3-5-8-5z" stroke="currentColor" stroke-width="1.5"/>
                                            <circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-options">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="remember">
                                    <span>Remember me</span>
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                            <div class="auth-footer">
                                <p>Don't have an account? <a href="#register">Sign up</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Register Section -->
            <div class="auth-section" id="register">
                <div class="auth-label">REGISTER PAGE 1440</div>
                <div class="auth-container">
                    <div class="auth-banner">
                        <h2>Get started<br>now!</h2>
                    </div>
                    <div class="auth-form-wrapper">
                        <h3>Register</h3>
                        <form class="auth-form" id="registerForm">
                            <div class="form-group">
                                <label for="registerName">Full Name</label>
                                <input type="text" id="registerName" name="name" placeholder="John Doe" required>
                            </div>
                            <div class="form-group">
                                <label for="registerEmail">Email</label>
                                <input type="email" id="registerEmail" name="email" placeholder="name@email.com" required>
                            </div>
                            <div class="form-group">
                                <label for="registerPhone">Phone</label>
                                <input type="tel" id="registerPhone" name="phone" placeholder="+1 (555) 000-0000" required>
                            </div>
                            <div class="form-group">
                                <label for="registerPassword">Password</label>
                                <div class="password-input">
                                    <input type="password" id="registerPassword" name="password" placeholder="••••••••••" required>
                                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                            <path d="M10 5C5 5 2 10 2 10s3 5 8 5 8-5 8-5-3-5-8-5z" stroke="currentColor" stroke-width="1.5"/>
                                            <circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="registerPasswordConfirm">Confirm Password</label>
                                <div class="password-input">
                                    <input type="password" id="registerPasswordConfirm" name="passwordConfirm" placeholder="••••••••••" required>
                                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                            <path d="M10 5C5 5 2 10 2 10s3 5 8 5 8-5 8-5-3-5-8-5z" stroke="currentColor" stroke-width="1.5"/>
                                            <circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block">Register Now</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
